<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/simpleloginpage.css">
    <title>Login//signup</title>
</head>
<body>
    <div class="loginwin">
        <div class="quicklogin">
            <h2><button><img src="../pics/icons/search.png" alt="Google" id="Google">Google</button></h2>
            <h2><button><img src="../pics/icons/facebookc.png" alt="facebook" id="facebook">facebook</button></h2>
            <h2><button><img src="../pics/icons/github.png" alt="Github" id="Github">Github</button></h2>
        </div>

        <div class="loginform">
            <form action="">
                <label for="Email">example@gmail.com</label>
                <input type="text" id="mail" name="mail" required><br><br>

                <label for="password">Enter password</label>
                <input type="password" id="password" name="password" required><br><br>

                <div class="options">
                    <h2><a href="">forget password?</a></h2>  
                    <input type="submit" value="Login">
                </div>
                
            </form>
        </div>
        <h2>Sign up</h2>
    </div>
</body>
</html>
