<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="../stylesheets/time-traching.css">
  <title>Time tracking dashboard</title>


</head>
<body>

<div class="Grid_Container">
  <div id="namecard" class="cards">
    <div class="profile">
      <div id="image_pro"><img src="../pics/Illestrative_Items/jpg" alt="Profile" class="profile-img">
      </div>
      
      <div class="profile-info">
        <p>Report for</p>
        <h1>Karlo Karlson</h1>
      </div>
    </div>
    <div class="timeframes">
      <button class="timeframe active">Daily</button>
      <button class="timeframe">Weekly</button>
      <button class="timeframe">Monthly</button>
    </div>
  </div>
  

  <div id="work" class="cards">
    <img src="../pics/Illestrative_Items/icon-work.svg" alt="Work" class="card-icon">
    <div class="inner_div" id="work_inner">
      <div class="activity-header">
        <h2>Work</h2>
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>
    <div id="play" class="cards">
    <img src="../pics/Illestrative_Items/icon-play.svg" alt="Play" class="card-icon">
    <div class="inner_div" id="play_inner">
      <div class="activity-header">
        <h2>Play</h2>
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>

    <div id="study" class="cards">
    <img src="../pics/Illestrative_Items/icon-study.svg" alt="Study" class="card-icon">
    <div class="inner_div" id="study_inner">
      <div class="activity-header">
        <h2>Study</h2>
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>

    <div id="exersise" class="cards">
    <img src="../pics/Illestrative_Items/icon-exercise.svg" alt="Exerseise" class="card-icon">
    <div class="inner_div" id="exersise_inner">
      <div class="activity-header">
        <h2>Exerseise</h2>
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>

    <div id="Social" class="cards">
    <img src="../pics/Illestrative_Items/icon-social.svg" alt="Social" class="card-icon">
    <div class="inner_div" id="social_inner">
      <div class="activity-header">
        <h2>Social</h2>       
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>

    <div id="self_Care" class="cards">
    <img src="../pics/Illestrative_Items/icon-self-care.svg" alt="selfCare" class="card-icon">
    <div class="inner_div" id="work_inner">
      <div class="activity-header">
        <h2>Self Care</h2>
        <span>...</span>
      </div>
      <div class="time-display">
        <h3 class="current-hours">5hrs</h3>
        <p class="previous-hours">Previous - 7hrs</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
